name: Custom Build

# Builds a Release-configuration cmux.app with the custom visual layer on top
# of upstream manaflow-ai/cmux. Output bundle ID is com.cmuxterm.app (same as
# the real Cmux) so the artifact can replace /Applications/Cmux.app directly.
# Sparkle auto-update is disabled in the built bundle to prevent upstream's
# appcast from silently clobbering the custom build.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - custom-visuals

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-${{ hashFiles('.gitmodules', 'ghostty') }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -project GhosttyTabs.xcodeproj -scheme cmux -configuration Release \
            -resolvePackageDependencies

      - name: Build cmux (Release)
        env:
          CMUX_SKIP_ZIG_BUILD: "1"
        run: |
          set -euo pipefail
          xcodebuild \
            -project GhosttyTabs.xcodeproj \
            -scheme cmux \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SPARKLE_PUBLIC_KEY="" \
            build

      - name: Locate built app
        id: locate
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release -maxdepth 2 -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app produced" >&2
            ls -R build/Build/Products/Release || true
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH" .app)"
          echo "Found $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Disable Sparkle auto-update in built bundle
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          PLIST="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :SUEnableAutomaticChecks false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :SUAutomaticallyUpdate false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL " "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CmuxCustomBuild bool true" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :CmuxCustomBuild true" "$PLIST"
          echo "--- verified Sparkle settings ---"
          /usr/libexec/PlistBuddy -c "Print :SUEnableAutomaticChecks" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUAutomaticallyUpdate" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"

      - name: Re-sign bundle ad-hoc (plist edits invalidate the signature)
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          codesign --remove-signature "$APP_PATH" 2>/dev/null || true
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | sed -n '1,10p'

      - name: Determine version and tag
        id: version
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          UPSTREAM_VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "upstream_version=$UPSTREAM_VER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"           >> "$GITHUB_OUTPUT"
          echo "custom_tag=custom-latest"       >> "$GITHUB_OUTPUT"
          echo "custom_title=Custom Cmux ${UPSTREAM_VER} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"

      - name: Package app with ditto (preserves _CodeSignature)
        id: package
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          set -euo pipefail
          OUT="/tmp/cmux-custom.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"
          ls -lh "$OUT"
          shasum -a 256 "$OUT" > "${OUT}.sha256"
          cat "${OUT}.sha256"
          echo "zip_path=$OUT"             >> "$GITHUB_OUTPUT"
          echo "sha256_path=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish floating custom-latest release
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          ZIP_PATH:     ${{ steps.package.outputs.zip_path }}
          SHA_PATH:     ${{ steps.package.outputs.sha256_path }}
          CUSTOM_TAG:   ${{ steps.version.outputs.custom_tag }}
          CUSTOM_TITLE: ${{ steps.version.outputs.custom_title }}
          UPSTREAM_VER: ${{ steps.version.outputs.upstream_version }}
          SHORT_SHA:    ${{ steps.version.outputs.short_sha }}
          COMMIT_SHA:   ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES_FILE="$(mktemp)"
          {
            printf 'Upstream version: %s\n' "$UPSTREAM_VER"
            printf 'Commit: %s\n' "$SHORT_SHA"
            printf 'Built: %s\n\n' "$BUILD_TIME"
            printf 'Ad-hoc signed. Install via install-cmux-custom.command.\n'
          } > "$NOTES_FILE"
          gh release delete "$CUSTOM_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$CUSTOM_TAG" \
            --title "$CUSTOM_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$COMMIT_SHA" \
            --prerelease \
            "$ZIP_PATH" "$SHA_PATH"
          gh release view "$CUSTOM_TAG"

      - name: Also publish as workflow artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: cmux-custom-${{ steps.version.outputs.short_sha }}
          path: |
            /tmp/cmux-custom.zip
            /tmp/cmux-custom.zip.sha256
          if-no-files-found: error
          retention-days: 30
